<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI안전챗봇 기능 활용 이벤트 | 국립생태원</title>
<meta name="description" content="AI안전챗봇 기능 활용 이벤트 포스터. 안전빙고 챌린지와 기능개선 의견 제안, 2026. 10. 14.(수) ~ 11. 13.(금)">
<meta property="og:title" content="AI안전챗봇 기능 활용 이벤트">
<meta property="og:description" content="9개 안전미션 빙고를 채우고 기프티콘 추첨 기회를 받으세요! 2026. 10. 14.(수) ~ 11. 13.(금)">
<meta property="og:image" content="https://niesafe1-byte.github.io/safety/event-poster.jpg">
<meta property="og:url" content="https://niesafe1-byte.github.io/safety/poster.html">
<meta property="og:type" content="website">
<meta name="theme-color" content="#eef7ff">
<link rel="icon" href="icon-192.png">
<style>
  :root { --navy:#173a8a; --orange:#e6761a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body { background:#e6f0f8; font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#15224a; }
  .wrap { max-width:600px; margin:0 auto; background:#fff; min-height:100vh; padding-bottom:calc(92px + env(safe-area-inset-bottom)); box-shadow:0 0 30px rgba(30,70,120,.08); }
  .wrap img { display:block; width:100%; height:auto; }
  .hint { margin:10px 16px 0; font-size:12.5px; color:#6b7690; text-align:center; }
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(180deg, rgba(255,255,255,0), #fff 30%); }
  .bar div { width:100%; max-width:576px; display:grid; grid-template-columns:1fr 1.4fr; gap:8px; }
  .bar a { display:flex; align-items:center; justify-content:center; min-height:52px; border-radius:14px; text-decoration:none; font-size:16px; font-weight:800; letter-spacing:-.02em; }
  .bar a.sub { background:#fff; color:var(--navy); border:1.5px solid #b9cdf0; }
  .bar a.go { background:linear-gradient(135deg,#f59a3a,var(--orange)); color:#fff; box-shadow:0 6px 14px rgba(230,118,26,.3); }
</style>
</head>
<body>
  <main class="wrap">
    <img src="event-poster.jpg" alt="AI안전챗봇 기능 활용 이벤트 포스터. AI안전챗봇 3가지 기능(출장 자동화, 위험성평가 자동화, 안전날씨 도우미) 소개, 참여 방법(QR 접속 또는 카카오톡에서 국립생태원 AI안전챗봇 검색), 미션 1 안전빙고 9개 미션과 추첨권 혜택(치킨 모바일 기프티콘 40명), 미션 2 기능개선 의견 제안(20명 추첨). 기간 2026. 10. 14.(수) ~ 11. 13.(금).">
    <p class="hint">두 손가락으로 벌리면 크게 볼 수 있어요.</p>
  </main>
  <nav class="bar" aria-label="바로가기">
    <div>
      <a class="sub" href="./">안전도우미</a>
      <a class="go" href="event.html">이벤트 참여하기 ›</a>
    </div>
  </nav>
</body>
</html>
